[package]
name = "glue5-runtime"
description = "Host side of the game: Emscripten/WASI imports, threads, files, audio and input plumbing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glue5-game.workspace = true
anyhow.workspace = true
log.workspace = true
# The system's time zone, the same way on every platform.
jiff = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }
